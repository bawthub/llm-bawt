# Development override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  app:
    command: ["/app/server.sh", "start", "--stdout", "--debug"]
    # Dev mode: source mounted, manual restart needed after code changes
    # (--dev flag with auto-reload causes issues in Docker, so we skip it)

    # Use extra_hosts for local hostnames (DNS: Docker default handles external resolution)
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "postgres.home:10.0.2.32"
    
    volumes:
      # Mount source code for live development
      - ./src:/app/src
      - ./server.sh:/app/server.sh
      # Config, logs, models (mirrors base compose)
      - ${HOME}/.config/llm-bawt:/root/.config/llm-bawt
      - ./.logs:/app/.logs
      - ${MODELS_PATH:-./models}:/app/models
      # Share host caches to avoid duplicate downloads
      - ${LLM_BAWT_MODEL_CACHE_DIR:-${HOME}/.cache/llm-bawt/models}:/root/.cache/llm-bawt/models
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      # MediaStore blobs (TASK-223) — mirrors base compose so dev mode has it too.
      - ${LLM_BAWT_MEDIA_HOST_PATH:-/mnt/user/home/echo/llmbawt-media}:/var/lib/llm-bawt/media

    # Restart on reboot and on failure
    restart: unless-stopped

  claude-code-bridge:
    volumes:
      - ./src:/app/src

  codex-bridge:
    volumes:
      - ./src:/app/src

  # Dev: mount src so the embed server / bridge code (TASK-277) deploys on a
  # restart without rebuilding the heavy CUDA image.
  local-model-bridge:
    volumes:
      - ./src:/app/src
