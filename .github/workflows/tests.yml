name: llm-bawt tests

on:
  push:
  pull_request:

jobs:
  # TASK-2075: `make gate` runs `make test-all` at exactly a commit. The
  # integrator pushes a SHA whose unpatched gate run PASSED together with a
  # `bawthub-gate PASSED <gate id>` note on refs/notes/bawthub-gate, in one
  # atomic push (agent-skills `gate-push`). A master push with that note skips
  # the suite; anything else (another branch, a pull request, an ungated or
  # patched SHA, a failed note check) runs it.
  gate-note:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      covered: ${{ steps.note.outputs.covered }}
    steps:
      - uses: actions/checkout@v4
      - id: note
        env:
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          covered=false
          if git fetch -q --no-tags --depth=1 origin +refs/notes/bawthub-gate:refs/notes/bawthub-gate 2>/dev/null \
             && note=$(git notes --ref=bawthub-gate show "$SHA" 2>/dev/null) \
             && [[ "$note" == "bawthub-gate PASSED "* ]]; then
            covered=true
            echo "::notice::$SHA: $note; the offline suite already passed at this exact SHA, skipping it"
          else
            echo "$SHA has no PASSED gate note; running the offline suite"
          fi
          echo "covered=$covered" >> "$GITHUB_OUTPUT"

  offline:
    needs: gate-note
    if: ${{ !cancelled() && needs.gate-note.outputs.covered != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
      # Same serialized, fail-closed entrypoint as local development. No live
      # service, operational credentials, remote DB, or paid LLM invocation.
      # The 1s per-case unit budget is enforced on echo for every commit
      # (make test-snapshot) before it is pushed. This shared runner has fewer,
      # slower cores, cold caches and a virtual disk, so the same bound is
      # widened here: it still fails on hangs and new sleeps, not on runner
      # noise (TASK-1312). Tests marked real_process spawn a real binary whose
      # cold start here is outside their control (a node launcher: 0.1s on
      # echo, 3.3s once on this runner), so they get their own bound, about
      # twice the slowest seen; each run prints its slowest real_process case.
      # The worker count is pinned to what this runner's 4 vCPUs give by
      # default. `make test-stress` reads these values from this step, so the
      # local stress gate matches CI (TASK-1457).
      - run: make test-all
        env:
          # Public/fork CI has no installation data. Explicitly empty policy
          # still enforces the generic path/network/container rules; private
          # installations run the private policy in their exact-tip gate.
          GENERAL_USE_DENYLIST_JSON: '{"version":1,"mode":"public","hmac_key_file":"","operator_identities":[],"personal_domains":[],"container_names":[],"bot_slugs":[]}'
          LLM_BAWT_UNIT_TIME_BUDGET_SECONDS: "3"
          LLM_BAWT_REAL_PROCESS_TIME_BUDGET_SECONDS: "7"
          LLM_BAWT_TEST_WORKERS: "2"
