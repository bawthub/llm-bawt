name: llm-bawt tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
      # Same serialized, fail-closed entrypoint as local development. No live
      # service, operational credentials, remote DB, or paid LLM invocation.
      # The 1s per-case unit budget is enforced on echo for every commit
      # (make test-snapshot) before it is pushed. This shared runner has fewer,
      # slower cores, cold caches and a virtual disk, so the same bound is
      # widened here: it still fails on hangs and new sleeps, not on runner
      # noise (TASK-1312). Tests marked real_process spawn a real binary whose
      # cold start here is outside their control (a node launcher: 0.1s on
      # echo, 3.3s once on this runner), so they get their own bound, about
      # twice the slowest seen; each run prints its slowest real_process case.
      # The worker count is pinned to what this runner's 4 vCPUs give by
      # default. `make test-stress` reads these values from this step, so the
      # local stress gate matches CI (TASK-1457).
      - run: make test-all
        env:
          LLM_BAWT_UNIT_TIME_BUDGET_SECONDS: "3"
          LLM_BAWT_REAL_PROCESS_TIME_BUDGET_SECONDS: "7"
          LLM_BAWT_TEST_WORKERS: "2"
