name: Tenant app image

# Test both native architectures on PRs. Publishing is on demand (TASK-2075):
# a workflow_dispatch for one exact SHA on master builds both architectures and
# combines them into a digest-addressable manifest. It never deploys or moves
# latest. Master pushes build nothing; a tenant install or upgrade dispatches
# this for the SHA it needs and pins the digests the run reports.
#
# Two tenant images come from this repo: the CPU app and the agent bridge
# every tenant runs for its first agent (TASK-1293). The bridge image is built
# with Bitwarden's public server as its vault default: Dockerfile.agent-bridge
# defaults to the operator's own vault, which a tenant must never point at.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on master to build and publish
        required: true
        type: string

permissions: {}

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [app, agent-bridge]
        include:
          - image: app
            dockerfile: Dockerfile.app
            build-args: ""
          - image: agent-bridge
            dockerfile: Dockerfile.agent-bridge
            build-args: BW_SERVER_URL=https://vault.bitwarden.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          # '0' (full history, for the ancestry check) is a non-empty string, so truthy.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          persist-credentials: false
      # A dispatch publishes only a commit master already contains.
      - if: github.event_name == 'workflow_dispatch'
        name: The SHA is a commit on master
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), not $SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/master || { echo "::error::$SHA is not on master"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.image }} natively
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/bawthub/${{ matrix.image }}:sha-${{ inputs.sha || github.event.pull_request.head.sha }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: false
          build-args: |
            SOURCE_SHA=${{ inputs.sha || github.event.pull_request.head.sha }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=tenant-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=tenant-${{ matrix.image }}-${{ matrix.arch }},mode=max

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, agent-bridge]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine and verify native ${{ matrix.image }} images
        env:
          IMAGE: ghcr.io/bawthub/${{ matrix.image }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          tag="$IMAGE:sha-$SOURCE_SHA"
          docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"
          docker buildx imagetools inspect "$tag" --raw | jq -e \
            '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Missing multiarch $IMAGE digest"; exit 1; }
          printf '%s@%s\n' "$IMAGE" "$digest" > "tenant-${{ matrix.image }}-image-ref.txt"
      - uses: actions/upload-artifact@v6
        with:
          # The app artifact keeps its original name so existing readers still work.
          name: ${{ matrix.image == 'app' && 'tenant-app-digest' || format('tenant-{0}-digest', matrix.image) }}
          path: tenant-${{ matrix.image }}-image-ref.txt
          if-no-files-found: error
