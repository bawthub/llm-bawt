name: Tenant app image

# Test both native architectures on PRs. Only a successful master push's
# completed test workflow may publish a digest-addressable manifest; never
# deploy or move latest.
#
# Two tenant images come from this repo: the CPU app and the agent bridge
# every tenant runs for its first agent (TASK-1293). The bridge image is built
# with Bitwarden's public server as its vault default: Dockerfile.agent-bridge
# defaults to the operator's own vault, which a tenant must never point at.
on:
  pull_request:
  workflow_run:
    workflows: [llm-bawt tests]
    types: [completed]

permissions: {}

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [app, agent-bridge]
        include:
          - image: app
            dockerfile: Dockerfile.app
            build-args: ""
          - image: agent-bridge
            dockerfile: Dockerfile.agent-bridge
            build-args: BW_SERVER_URL=https://vault.bitwarden.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'workflow_run'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.image }} natively
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'workflow_run' }}
          tags: ghcr.io/bawthub/${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: false
          build-args: |
            SOURCE_SHA=${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=tenant-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=tenant-${{ matrix.image }}-${{ matrix.arch }},mode=max

  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, agent-bridge]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine and verify native ${{ matrix.image }} images
        env:
          IMAGE: ghcr.io/bawthub/${{ matrix.image }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="$IMAGE:sha-$SOURCE_SHA"
          docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"
          docker buildx imagetools inspect "$tag" --raw | jq -e \
            '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Missing multiarch $IMAGE digest"; exit 1; }
          printf '%s@%s\n' "$IMAGE" "$digest" > "tenant-${{ matrix.image }}-image-ref.txt"
      - uses: actions/upload-artifact@v6
        with:
          # The app artifact keeps its original name so existing readers still work.
          name: ${{ matrix.image == 'app' && 'tenant-app-digest' || format('tenant-{0}-digest', matrix.image) }}
          path: tenant-${{ matrix.image }}-image-ref.txt
          if-no-files-found: error
