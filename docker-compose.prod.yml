# docker-compose.prod.yml — self-contained, CPU-only tenant stack.
#
# This is the repaveable "prod" artifact (tasks #2/#3). Unlike docker-compose.yml
# (dev-flavored: local builds + $HOME bind mounts), this file:
#   * pulls immutable images from ghcr.io/bawthub/* (no build)
#   * carries ZERO host bind mounts — all state lives in named volumes + the
#     in-stack Postgres, so the compute can be repaved without data restore
#   * bundles its OWN Postgres (pgvector) so a tenant is fully isolated; there
#     is no shared/external DB
#
# Deliberately minimal for instance #1's first boot: postgres + redis + app.
# Voice (OpenAI STT), agent bridges, crawl4ai/playwright come in later profiles
# once the app+DB bootstrap path is proven clean.
#
# Requires a sibling .env (see the LLM_BAWT_POSTGRES_PASSWORD below).

services:
  postgres:
    image: pgvector/pgvector:pg16
    # TASK-834: never append the host DNS search domain to bare service names.
    # Before the in-stack container registers in Docker DNS (daemon restart ignores
    # depends_on), "postgres" would otherwise resolve via the LAN to a foreign host.
    dns_search: ["."]
    container_name: bawthub-postgres
    environment:
      - POSTGRES_USER=${LLM_BAWT_POSTGRES_USER:-llm_bawt}
      - POSTGRES_PASSWORD=${LLM_BAWT_POSTGRES_PASSWORD:?set LLM_BAWT_POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${LLM_BAWT_POSTGRES_DATABASE:-llm_bawt}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LLM_BAWT_POSTGRES_USER:-llm_bawt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: give the frontend (Prisma) its OWN database inside the in-stack
  # Postgres. It must NOT share `llm_bawt` with the app — `prisma db push`
  # treats unknown tables as drift and would drop the app's schema (TASK-376).
  db-init:
    image: pgvector/pgvector:pg16
    dns_search: ["."]
    container_name: bawthub-db-init
    environment:
      - PGHOST=postgres
      - PGUSER=${LLM_BAWT_POSTGRES_USER:-llm_bawt}
      - PGPASSWORD=${LLM_BAWT_POSTGRES_PASSWORD:?set LLM_BAWT_POSTGRES_PASSWORD in .env}
      - PGDATABASE=${LLM_BAWT_POSTGRES_DATABASE:-llm_bawt}
      - BAWTHUB_DB=${BAWTHUB_POSTGRES_DATABASE:-bawthub}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -v ON_ERROR_STOP=1 -tAc
        "SELECT 1 FROM pg_database WHERE datname = '$$BAWTHUB_DB'" | grep -q 1
        || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$BAWTHUB_DB\""
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    dns_search: ["."]
    container_name: bawthub-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  app:
    image: ghcr.io/bawthub/app:${IMAGE_TAG:-latest}
    dns_search: ["."]
    container_name: bawthub-app
    env_file:
      - ./.env
    environment:
      # Bind the service to all interfaces so the published port is reachable
      # from outside the container (default is 127.0.0.1 = loopback-only, which
      # makes the -p publish reset the connection).
      - LLM_BAWT_SERVICE_HOST=0.0.0.0
      # Point the app at the in-stack Postgres (reachable by service name).
      - LLM_BAWT_POSTGRES_HOST=postgres
      - LLM_BAWT_POSTGRES_PORT=5432
      - LLM_BAWT_POSTGRES_USER=${LLM_BAWT_POSTGRES_USER:-llm_bawt}
      - LLM_BAWT_POSTGRES_PASSWORD=${LLM_BAWT_POSTGRES_PASSWORD:?set LLM_BAWT_POSTGRES_PASSWORD in .env}
      - LLM_BAWT_POSTGRES_DATABASE=${LLM_BAWT_POSTGRES_DATABASE:-llm_bawt}
      # The app's Config reads env with the LLM_BAWT_ prefix; without this the
      # shared agent Redis transport never starts and /v1/ws (unified SSE for
      # tool activity / turn events) answers 503. Bare REDIS_URL is what the
      # agent bridges read — keep both.
      - LLM_BAWT_REDIS_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      # Memory embeddings (TASK-277) POST to this CPU endpoint. Optional for
      # boot: if unset/unreachable the stack still comes up; only memory/vector
      # writes degrade until an embed service is present. Default points at an
      # in-stack CPU embed service (add later — see TASK-346); a tenant may also
      # point it at any reachable embed endpoint. Embeddings are CPU (MiniLM),
      # NOT GPU — no GPU needed for a functional tenant.
      - LOCAL_MODEL_EMBED_URL=${LOCAL_MODEL_EMBED_URL:-http://local-model-bridge:8684}
      # Storage stays LOCAL: fs backend on the app-storage named volume. Do NOT
      # point LLM_BAWT_STORAGE_BACKEND=s3 at echo's Garage (10.0.2.38) — that is
      # a cross-tenant data leak. s3 is only valid against a tenant-OWNED store.
      - LLM_BAWT_STORAGE_BACKEND=${LLM_BAWT_STORAGE_BACKEND:-fs}
      # TASK-1472: the BawtHub service bearer is derived from the master key,
      # so there is nothing to provision. The app writes it at startup, 0600,
      # owned by the frontend image's own user (uid 1001); the frontend reads
      # it from the shared volume. Override: BAWTHUB_SERVICE_TOKEN[_FILE] in .env.
      - BAWTHUB_SERVICE_TOKEN_EXPORT_FILE=/run/bawthub-service-token/token
      - BAWTHUB_SERVICE_TOKEN_EXPORT_UID=${BAWTHUB_SERVICE_TOKEN_EXPORT_UID:-1001}
    ports:
      - "${MCP_PORT:-8001}:8001"
      - "${SERVICE_PORT:-8642}:8642"
    volumes:
      # Named volumes, not host mounts — portable + repaveable.
      - app-config:/root/.config/llm-bawt
      - app-storage:/app/storage
      - app-logs:/app/.logs
      - bawthub-service-token:/run/bawthub-service-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # TASK-835: the coding surface. Without this the tenant is a chat product —
  # nothing can read or write a repo. Runs the SAME shared agent-bridge image as
  # dev, minus every echo-ism: no credential bind mounts (tokens come from the
  # app's broker endpoint, TASK-635/636), no ~/.ssh mount, no extra_hosts.
  claude-code-bridge:
    image: ghcr.io/bawthub/agent-bridge:${BRIDGE_TAG:-latest}
    dns_search: ["."]
    container_name: bawthub-claude-code-bridge
    command: ["python", "-m", "claude_code_bridge"]
    env_file:
      - ./.env
    environment:
      # CLAUDE_CODE_MODEL is deliberately unset — every request carries its own
      # model, resolved from the bot's default_model catalog row.
      - CLAUDE_CODE_BRIDGE_LOG_LEVEL=${CLAUDE_CODE_BRIDGE_LOG_LEVEL:-INFO}
      - LLM_BAWT_API_URL=http://app:8642
      # Override the 0.0.0.0 the app needs as a BIND address: from inside a
      # bridge the service is a compose service name, and the `llm` CLI dials it.
      - LLM_BAWT_SERVICE_HOST=app
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_TOOL_SEARCH=true
      - CLAUDE_CODE_SKILLS_PATH=/home/bridge/dev/agent-skills
      - CLAUDE_CODE_BAWTHUB_MCP_URL=http://app:8001/mcp
      # Turn on the baked git credential helper (see Dockerfile.agent-bridge).
      # Done through GIT_CONFIG_* rather than a baked ~/.gitconfig so the same
      # image stays inert on the dev host, where bridges push over SSH.
      # The insteadOf rewrite makes `git@github.com:` clones work with no key.
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=credential.helper
      - GIT_CONFIG_VALUE_0=bawthub
      - "GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf"
      # Quoted: the trailing colon would otherwise make YAML read this entry as
      # a map instead of a string.
      - "GIT_CONFIG_VALUE_1=git@github.com:"
    volumes:
      # Agent workspace. Named volume, seeded from the image path (which the
      # Dockerfile pre-creates as bridge:bridge). Shared READ-ONLY into the
      # frontend below so the /repos viewer sees the trees the agent edits.
      - bridge-dev:/home/bridge/dev
      # Claude Code state: sessions, settings.json, the skills symlink.
      - bridge-claude:/home/bridge/.claude
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8681/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/bawthub/frontend:${FRONTEND_TAG:-latest}
    dns_search: ["."]
    container_name: bawthub-frontend
    environment:
      # Server-side calls to the LLM backend go to the in-stack app service.
      - BAWTHUB_LLM_URL=http://app:8642
      # Frontend's own Prisma DB — a SEPARATE database (created by db-init) in
      # the in-stack Postgres. Never the app's `llm_bawt` DB: see db-init.
      - DATABASE_URL=postgresql://${LLM_BAWT_POSTGRES_USER:-llm_bawt}:${LLM_BAWT_POSTGRES_PASSWORD:?set LLM_BAWT_POSTGRES_PASSWORD in .env}@postgres:5432/${BAWTHUB_POSTGRES_DATABASE:-bawthub}
      # Self-serve schema sync on start (prisma db push + prisma/sql deltas).
      - PRISMA_DB_PUSH=1
      - STORAGE_BACKEND=fs
      # TASK-1472: the service token the app exported (read on every call).
      - BAWTHUB_SERVICE_TOKEN_FILE=/run/bawthub-service-token/token
    volumes:
      # Only the exported service token; read-only, never the master key.
      - bawthub-service-token:/run/bawthub-service-token:ro
      # TASK-835: the /repos dashboard reads REPOS_ROOT (default /repos). Same
      # volume the bridge writes, mounted READ-ONLY here — the viewer's git
      # status/diff physically cannot mutate a tree (TASK-634 invariant).
      - bridge-dev:/repos:ro
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  app-config:
  app-storage:
  app-logs:
  # TASK-1472: the exported BawtHub service token (app writes, frontend reads).
  bawthub-service-token:
  # Agent workspace — written by claude-code-bridge, read-only in frontend.
  bridge-dev:
  bridge-claude:
