# Explicit TASK-861 override. Append LAST to the existing COMPOSE_FILE list.
# No existing compose files are modified. See docs/OPERATIONS_RUNNER.md.
services:
  app:
    # TASK-1173: admission-only. The app prepares jobs over the ops control
    # channel and never runs a worker, so it has no Docker socket or worker env.
    environment:
      LLM_BAWT_OPS_RECEIPT_ROOT: /var/lib/llm-bawt-ops
      # TASK-997 release-deploy credentials are NOT env: they are the DB-stored
      # github-release / ghcr-pull provider connections (CredentialStore).
    volumes:
      - ops-receipts:/var/lib/llm-bawt-ops

  ops-reconciler:
    # Must be the verified existing CPU app image, not a guessed image tag.
    image: ${LLM_BAWT_OPS_RECONCILER_IMAGE:?Set existing app image ID or digest}
    entrypoint: ["python", "-m", "llm_bawt.ops.reconciler"]
    command: []
    # Internal network only: no host port, proxy route or generic Docker API.
    # 8650 is the GET-only health surface; 8651 is the app's bearer-authenticated
    # prepare/readiness channel (TASK-1169 S3).
    expose: ["8650", "8651"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8650/health/ready', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 5s
    # TASK-1476: no env_file. The reconciler reads the database settings and
    # logging config; a bare name takes its value from the project .env and
    # is omitted when unset. Provider credentials it decrypts come from the DB.
    environment:
      LLM_BAWT_OPS_WORKER_IMAGE: ${LLM_BAWT_OPS_WORKER_IMAGE:?Set immutable worker image ID or digest}
      LLM_BAWT_OPS_RECEIPT_VOLUME: ${LLM_BAWT_OPS_RECEIPT_VOLUME:?Set dedicated named volume name}
      LLM_BAWT_OPS_RECEIPT_ROOT: /var/lib/llm-bawt-ops
      # TASK-1169 S4: process-mode jobs pin this interpreter identity (the
      # reconciler's own immutable image) in their approved snapshot.
      LLM_BAWT_OPS_RECONCILER_IMAGE: ${LLM_BAWT_OPS_RECONCILER_IMAGE:?Set existing app image ID or digest}
      POSTGRES_HOST:
      POSTGRES_PORT:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DATABASE:
      LLM_BAWT_POSTGRES_HOST:
      LLM_BAWT_POSTGRES_PORT:
      LLM_BAWT_POSTGRES_USER:
      LLM_BAWT_POSTGRES_PASSWORD:
      LLM_BAWT_POSTGRES_DATABASE:
      LLM_BAWT_DEFAULT_USER:
      LLM_BAWT_LOG_DIR:
      LLM_BAWT_LOG_PREFIX:
      LLM_BAWT_REDIS_URL:
      # TASK-1865 batch gates: driven only when the scratch path is set. The
      # repository is read-only git input; scratch must be the identical path
      # on the host because the runner's bind mounts resolve on the daemon.
      LLM_BAWT_OPS_GATE_REPOSITORY: /srv/llm-bawt-repo
      LLM_BAWT_OPS_GATE_SCRATCH: ${LLM_BAWT_OPS_GATE_SCRATCH:-}
    volumes:
      - ./src:/app/src:ro
      - .:/srv/llm-bawt-repo:ro
      - ${LLM_BAWT_OPS_GATE_SCRATCH:-/tmp/llm-bawt-ops-gate-disabled}:${LLM_BAWT_OPS_GATE_SCRATCH:-/tmp/llm-bawt-ops-gate-disabled}
      # Read only the app's existing encryption key, not its full config directory.
      # Release reconciliation must decrypt the same DB-stored provider credentials.
      - ${HOME}/.config/llm-bawt/secret.key:/root/.config/llm-bawt/secret.key:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ops-receipts:/var/lib/llm-bawt-ops
    restart: unless-stopped

volumes:
  ops-receipts:
    name: ${LLM_BAWT_OPS_RECEIPT_VOLUME:?Set dedicated named volume name}
